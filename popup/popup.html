<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lingua Word Breakdown</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- Main View -->
    <div id="main-view">
      <header class="header">
        <h1 class="logo">Lingua</h1>
        <nav class="tab-bar" role="tablist" aria-label="Main navigation">
          <button id="tab-analysis" class="tab-btn tab-active" role="tab" aria-selected="true" data-tab="analysis">Analysis</button>
          <button id="tab-history" class="tab-btn" role="tab" aria-selected="false" data-tab="history">History</button>
          <button id="tab-translate" class="tab-btn" role="tab" aria-selected="false" data-tab="translate">Translate</button>
        </nav>
        <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Open settings">&#9881;</button>
      </header>

      <!-- Analysis panel -->
      <div id="analysis-panel">
        <div class="input-section">
          <textarea id="input-text" placeholder="Paste or type text in any language&#8230;" rows="4"></textarea>
          <div id="char-count" class="char-count">0 / 2000</div>
          <button id="analyze-btn" type="button" class="btn-primary">Analyze</button>
        </div>

        <div id="error-banner" class="error-banner" role="alert" hidden>
          <p id="error-message" class="error-message"></p>
          <div class="error-btns">
            <button id="retry-btn" type="button" class="btn-secondary" hidden>Retry</button>
            <button id="settings-link-btn" type="button" class="btn-secondary" hidden>Open Settings</button>
          </div>
        </div>

        <div id="results" aria-live="polite" role="status" hidden>
          <p id="translation" class="translation"></p>
          <div id="tokens-grid" class="tokens-grid"></div>
        </div>
      </div>

      <!-- Bulk translation panel -->
      <section id="bulk-section" hidden>
        <div class="bulk-input-row">
          <textarea id="bulk-input" placeholder="Paste forum post here…"></textarea>
          <div class="bulk-actions">
            <button id="bulk-submit" type="button" class="btn-primary">Translate</button>
            <button id="bulk-cancel" type="button" class="btn-secondary" hidden>Cancel</button>
          </div>
          <div class="bulk-meta-row">
            <span id="bulk-progress"></span>
            <span id="bulk-cache-stats"></span>
          </div>
          <span id="bulk-status"></span>
        </div>
        <div id="bulk-results"></div>
      </section>

      <!-- History panel -->
      <div id="history-panel" hidden>
        <ul id="history-list" role="list"></ul>
        <button id="load-more" type="button" class="btn-secondary" hidden>Load more</button>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay" hidden>
      <div class="spinner"></div>
    </div>

    <!-- Settings View -->
    <div id="settings-view" hidden>
      <header class="header">
        <h1 class="logo">Settings</h1>
        <button id="cancel-btn" class="icon-btn" title="Close" aria-label="Close settings">&#10005;</button>
      </header>
      <div class="settings-section">
        <div class="settings-label-row">
          <label for="api-key-input" class="settings-label">Anthropic API Key</label>
          <a href="https://console.anthropic.com/account/keys" target="_blank" rel="noopener" class="get-key-link">Get API key ↗</a>
        </div>
        <input type="password" id="api-key-input" class="api-key-input" placeholder="sk-ant-&#8230;" autocomplete="off" spellcheck="false">
        <p class="hint">Stored locally in your browser. Never shared with anyone except Anthropic.</p>
      </div>
      <div class="settings-section settings-section-divided">
        <div class="settings-label-row">
          <label for="deepl-key-input" class="settings-label">DeepL API Key <span class="settings-optional">(optional)</span></label>
          <a href="https://www.deepl.com/pro-api" target="_blank" rel="noopener" class="get-key-link">Get free key ↗</a>
        </div>
        <input type="password" id="deepl-key-input" class="api-key-input" placeholder="&#8230;:fx" autocomplete="off" spellcheck="false">
        <p class="hint">Offloads translation to DeepL — faster and ~30% cheaper per request. 500k characters/month free. Leave blank to remove.</p>
        <div id="settings-error" class="settings-error" hidden></div>
        <button id="save-btn" type="button" class="btn-primary">Save</button>
      </div>
    </div>

  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
